[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rf-detr-playground"
version = "0.1.0"
description = "A playground for training and evaluating RF-DETR object detection models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "rfdetr>=1.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "pycocotools>=2.0",
    "supervision>=0.19",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "click>=8.0",
    "tqdm>=4.65",
    "Pillow>=9.0",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
metrics = ["rfdetr[metrics]"]
plus = ["rfdetr[plus]"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
all = ["rf-detr-playground[metrics,plus,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
